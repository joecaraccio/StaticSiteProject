[project]
name = "usually-late-pipeline"
version = "0.1.0"
description = "Flight reliability pipeline over public U.S. DOT / BTS on-time performance data"
requires-python = ">=3.12"
# Runtime deps are deliberately minimal: DuckDB reads CSV and writes Parquet
# natively, so no pandas/pyarrow is needed, and downloads use urllib from the
# standard library. Adding anything here needs an explicit OK (see CLAUDE.md).
dependencies = [
    "duckdb>=1.2",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: test that reaches the live BTS source (deselected by default)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
