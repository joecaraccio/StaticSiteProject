# Lint and tests on every push and pull request.
#
# `make ci` runs this exact file locally through act, so the two cannot drift.
# Keep the steps plain shell: anything clever here stops being reproducible.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

  site:
    name: Site build
    runs-on: ubuntu-latest
    # The site is only wired up from M5; skip cleanly until then rather than
    # failing every run.
    if: hashFiles('site/package.json') != ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund

      - name: Type check
        working-directory: site
        run: npm run check

      - name: Build
        working-directory: site
        run: npm run build

  mockup:
    name: End-to-end (synthetic)
    runs-on: ubuntu-latest
    # Generates synthetic data, pushes it through the real pipeline, builds the
    # site and checks every internal link. This is the only job that exercises
    # ingest -> metrics -> gates -> export -> site in one go, and it needs no
    # network access to BTS.
    if: hashFiles('site/package.json') != ''
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: |
          uv sync --locked
          cd site && npm ci --no-audit --no-fund

      - name: Generate synthetic data and export pages
        run: uv run python scripts/make_mockup_data.py --months 6

      - name: Build the site
        working-directory: site
        run: PAGES_DIR="$GITHUB_WORKSPACE/data/mockup/export" OUT_DIR=dist-mockup npm run build

      - name: Check internal links
        run: node scripts/check_links.mjs site/dist-mockup
