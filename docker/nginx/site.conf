# Serves the built Astro output. Mirrors what a static host does, so a link that
# works here should work in production.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Astro builds directory-style URLs (/routes/BOS-LGA/index.html), so try the
    # path, then the directory, then 404.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location = /robots.txt { try_files $uri =404; access_log off; }
    location ~ ^/sitemap.*\.xml$ { try_files $uri =404; access_log off; }

    error_page 404 /404.html;
    location = /404.html { internal; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
}
