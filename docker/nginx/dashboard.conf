# The dashboard. Nginx's templating substitutes the ${...} port variables from the
# container environment at startup, so the links match whatever ports you mapped.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ports are injected into a tiny JS file the page fetches, so index.html
    # stays a plain static file.
    location = /ports.js {
        default_type application/javascript;
        return 200 'window.PORTS = {dagu: ${DAGU_PORT}, duckdb: ${DUCKDB_UI_PORT}, web: ${WEB_PORT}, siteDev: ${SITE_DEV_PORT}};';
    }

    # Read-only view of the pipeline's own status files, so the dashboard can
    # show whether the source is verified and what has been ingested.
    location /data/ {
        alias /srv/data/;
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-store";
    }

    # The planning docs, rendered as plain text rather than downloaded.
    location /docs/ {
        alias /srv/docs/;
        autoindex on;
        default_type text/plain;
        charset utf-8;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
