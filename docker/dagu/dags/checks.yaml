# Lint and tests, the same checks GitHub runs.
#
# This runs them directly in the pipeline image, which is fast. To run the real
# GitHub workflow file instead — same runner images, same steps — use `make ci`,
# which drives act. Keep both: this one for a quick signal, act for parity.

name: checks
description: ruff + pytest in the pipeline image

schedule:
  - "0 7 * * 1"        # Monday morning, so a dependency drift shows up early
overlap_policy: skip
timeout_sec: 900

env:
  - PIPELINE_IMAGE: usually-late/pipeline:dev

steps:
  - id: lint
    action: docker.run
    with:
      image: ${PIPELINE_IMAGE}
      auto_remove: true
      working_dir: /app
      volumes:
        - ${HOST_REPO_PATH}:/app
      entrypoint: ["sh", "-lc"]
      command: "ruff check . && ruff format --check ."

  - id: test
    action: docker.run
    depends: lint
    with:
      image: ${PIPELINE_IMAGE}
      auto_remove: true
      working_dir: /app
      volumes:
        - ${HOST_REPO_PATH}:/app
      entrypoint: ["sh", "-lc"]
      command: "pytest -q"
