# Rebuild the site from whatever page JSON is already exported.
#
# This is the one to run while working on templates: it skips ingest and metrics
# entirely, so it finishes in seconds rather than minutes.

name: site-only
description: Re-export pages and rebuild the static site, without touching BTS

params:
  - name: skip_export
    type: boolean
    default: false
    description: Rebuild from the existing data/export JSON without re-exporting

env:
  - PIPELINE_IMAGE: usually-late/pipeline:dev
  - SITE_IMAGE: node:22-alpine

steps:
  - id: export-pages
    action: docker.run
    with:
      image: ${PIPELINE_IMAGE}
      auto_remove: true
      volumes:
        - ${HOST_REPO_PATH}/data:/data
      command: export
    preconditions:
      - condition: "${params.skip_export}"
        expected: "false"

  - id: build-site
    action: docker.run
    with:
      image: ${SITE_IMAGE}
      auto_remove: true
      working_dir: /site
      volumes:
        - ${HOST_REPO_PATH}/site:/site
        - ${HOST_REPO_PATH}/data:/data:ro
      command: sh -lc "npm ci --no-audit --no-fund && npm run build"
